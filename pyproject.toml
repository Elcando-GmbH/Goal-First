[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goalfirst"
version = "0.1.0"
description = "Reference implementation of the Goal First stock selection framework"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Laura Kruse-Stecher" }]
maintainers = [{ name = "Elcando GmbH" }]
keywords = ["stocks", "screener", "quant", "investing", "backtesting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Repository = "https://github.com/Elcando-GmbH/goal-first"
Issues = "https://github.com/Elcando-GmbH/goal-first/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/goalfirst"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
